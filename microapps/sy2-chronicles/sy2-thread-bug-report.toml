[proposed_fixes]

[[proposed_fixes.fix]]
priority = 1
name = "Message ID deduplication"
description = """
Maintain a seen-message-IDs set with ~30s TTL in the dispatch loop.
Before firing a completion, check if this ID has already been processed.
Prevents double-dispatch from edit events, re-deliveries, or thread creation
events re-triggering the listener.
"""

[[proposed_fixes.fix]]
priority = 2
name = "Thread creation sequencing"
description = """
When a reply requires creating a new thread:
  1. Create thread
  2. Await thread ID confirmation
  3. Post response into thread
Currently appears to post response first, then create thread.
Likely a missing await or wrong event ordering in the dispatch path.
"""

[[proposed_fixes.fix]]
priority = 3
name = "Thread-creation event guard"
description = """
If thread_create event re-triggers the message handler (possible in some
discord.py versions), add guard: if message.thread is not None and message
was already dispatched, skip.
"""

