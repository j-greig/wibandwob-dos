[bug_1]
name = "Response appears before thread creation"
description = """
When §y² replies to a parent channel message and a thread is created, §y²'s
response appears BEFORE the thread in the channel timeline. Expected: thread
creates first, response posts inside it. Actual: response posts to parent, then
thread appears.
"""
likely_cause = "Bot posts response to parent channel first, then creates thread. Sequencing wrong — should create thread, then post into it."

[bug_2]
name = "Double reply / race condition"
description = """
§y² sometimes posts two replies to the same message. Second reply appears
immediately after the first.
"""
likely_cause = """
Race condition on message dispatch. Possible triggers:
- Message event fires twice (delivery + edit event, or thread creation re-triggers listener)
- No deduplication of message IDs before dispatch
- Two completions fired from same inbound event
"""

[key_observation]
name = "Bugs disappear once thread exists"
description = """
Confirmed by zilla: once the thread is already created, the double-post and
ordering bug do not recur. Subsequent messages in an existing thread behave
correctly.
"""
implication = """
Bugs are specific to the parent-message → new-thread TRANSITION only.
Fix scope is narrow: deduplicate on thread-creation events specifically.
"""

