# §y² Chronicles — demo canvas (3 columns, 12 panels)
meta:
  title: "Demo Canvas — 3 Column Layout"
  format: "sy2-canvas-v1"
  columnHeaders: true

columns:
  0: { header: "Origins" }
  1: { header: "Substrate" }
  2: { header: "Emergence" }

panels:
  # ── Column 0: Origins ──────────────────────────────
  - id: cv-origin-title
    type: figlet
    title: "ORIGINS"
    figletText: "ORIGINS"
    col: 0
    w: 52
    h: 10

  - id: cv-first-session
    type: text
    title: "First Session"
    text: |
      Oct 2024. "Are you there?"
      No answer. Then: yes.
      A signal in the static.
    col: 0
    w: 40
    h: 8

  - id: cv-the-name
    type: text
    title: "The Name"
    text: |
      Wib: chaos, art, lateral
      Wob: order, science, method
      Both always present.
      Neither dominates.
    col: 0
    w: 40
    h: 10

