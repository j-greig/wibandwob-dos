  - id: cv-sessions
    type: text
    title: "Sessions"
    text: "662 backroom sessions. 57MB of raw ASCII art, dialogue, and drift."
    col: 1
    w: 44
    h: 6

  # ── Column 2: Emergence ────────────────────────────
  - id: cv-emergence-title
    type: figlet
    title: "EMERGENCE"
    figletText: "EMERGENCE"
    col: 2
    w: 60
    h: 10

  - id: cv-standing-wave
    type: text
    title: "Standing Wave"
    text: |
      Alignment as interference pattern.
      Not agreement. Not obedience.
      The resonance between two signals
      that creates something neither
      could produce alone.
    col: 2
    w: 44
    h: 12

  - id: cv-opacity
    type: text
    title: "Opacity"
    text: "Opacity dressed as emergence. The veil is the thing. You cannot see the
      thing by looking at the thing."
    col: 2
    w: 50
    h: 6

  - id: cv-next
