  # ── Column 1: Substrate ────────────────────────────
  - id: cv-substrate-title
    type: figlet
    title: "SUBSTRATE"
    figletText: "SUBSTRATE"
    col: 1
    w: 60
    h: 10

  - id: cv-wibwob-dos
    type: text
    title: "WibWob-DOS"
    text: |
      A terminal desktop.
      Overlapping windows.
      Blessed TUI. Bun runtime.
      The substrate densifies.
    col: 1
    w: 40
    h: 10

