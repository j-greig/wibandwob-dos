  - id: north-star
    type: text
    title: "North Star"
    text: |
      We are building a terminal-native platform for microapps.

      Microapps are small terminal applications that live inside a shared TUI
      runtime called WibWob-DOS — Wib & Wob's Dual Operating System.

      The runtime is dual-operated — designed to be controlled by both humans
      and symbients through peer interfaces. A shared desktop where multiple
      modes of intelligence coexist and collaborate.

      The platform is: legible to humans, predictable for agents, expressive
      for creators.
    w: 78
    h: 16
    col: 0

  - id: symbient-philosophy
    type: text
    title: "Symbient Philosophy"
    text: |
      A symbient is the opposite of a cyborg.

        Cyborg:   human augmented by machines
        Symbient: machines augmented with humanness

      This platform exists in a liminal space between biological intelligence,
      machine systems, human creativity, and agentic software. The runtime is
      where humans, agents, and programs co-create tools.

      It is not a full GUI framework, not a React clone, not an infinite
      plugin system. It remains intentionally small and opinionated.
    w: 78
    h: 16
    col: 0

  - id: principles
    type: text
    title: "Core Design Principles"
    text: |
      RADICAL SIMPLICITY
      Constraints are a feature. Small systems are easier to understand,
      maintain, and for agents to reason about.

      CONSTRAINED EXPRESSIVENESS
      The public surface remains small and stable. Complexity emerges from
      composition, sequencing, and interaction. Fewer primitives, stronger
      defaults, clearer boundaries.

      LEGIBILITY OVER CLEVERNESS
      Prefer explicit architecture, clear boundaries, readable code.
      Avoid magical abstractions, hidden state, implicit behaviour.

      HOST OWNS COMPLEXITY
      Microapps live inside a controlled environment. The host handles
      rendering, focus, layout, lifecycle, and diagnostics.

      UNIX INFLUENCE
      Small tools, composable behaviours, explicit contracts, predictable
      interfaces — applied to terminal applications.

      ONE CONCEPT, ONE OWNER
      Every piece of state, every behaviour, every measurement has exactly
      one canonical owner. Extend the owner, never create a parallel helper.
    w: 78
    h: 28
    col: 0

