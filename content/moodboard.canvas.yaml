  - id: coat-explanation
    type: text
    title: "COAT Explained"
    text: |
      COAT — Command Once, Adapt Thin.

      Every interface is just another client of the runtime. The platform is
      a shared semantic runtime with multiple peer interfaces:

        TUI  — blessed terminal interface
        CLI  — wibwob command surface
        API  — HTTP control surface (port 8099)

      The runtime owns four explicit seams:

        command    — one catalog, one dispatch path, one discovery surface
        inspection — one snapshot shape, one access path
        window     — one facade, one lifecycle
        workspace  — one save/restore path

      TUI, CLI, API, agent, and microapps are thin adapters over these seams.
      No adapter owns semantics. No adapter invents its own control path.

      Enforced by: bun run check-coat (6 automated checks, 0 violations)
    w: 70
    h: 24
    col: 1

  - id: sdk-contract
    type: text
    title: "SDK Stability Contract"
    text: |
      ┌─────────────────────────────────────────────┐
      │  SDK Contract (stable)                       │
      │  - typed Handles, Options, Events            │
      │  - semantic methods: update(), destroy()     │
      │  - theme tokens: theme().body, theme().footer│
      │                                              │
      │  ═══════════ stability boundary ═══════════  │
      │                                              │
      │  Implementation (mutable)                    │
      │  - blessed widgets, nodes, event wiring      │
      │  - internal layout math, chrome sizing       │
      │  - rendering optimisations                   │
      └─────────────────────────────────────────────┘

      Microapps code against the Handle interface, never against blessed.
      The host can replace the rendering engine without breaking microapps.

      Rules:
        1. No blessed exposure. Blessed is internal.
        2. Declarative over imperative.
        3. Limited host services: ui, commands, events, storage, logger.
        4. Stable semantic core. Add composition, not new primitives.
    w: 70
    h: 26
    col: 1

  - id: microapp-lifecycle
    type: text
    title: "Microapp Lifecycle"
    text: |
      1. DISCOVERY — microapp-loader scans microapps/ directories
      2. REGISTRATION — manifest read, commands added to catalog
      3. INSTANTIATION — host creates window, calls microapp factory
      4. RUNNING — microapp receives host handle, renders content
      5. RESTYLE — theme changes propagated via onRestyle callback
      6. SNAPSHOT — describeState() called for workspace save
      7. RESTORE — factory called with saved state args
      8. TEARDOWN — window closed, cleanup callbacks invoked

      Microapps are small. The host owns the hard parts.
    w: 70
    h: 16
    col: 1

  - id: tiers
    type: text
    title: "Microapp Tiers"
    text: |
      CORE    — ships with runtime, always available, never breaks
      STABLE  — production quality, tested, documented
      BETA    — functional but contract may change
      EXPERIMENT — prototypes, may be removed

      39 registered microapps. Zero SDK import violations.
    w: 60
    h: 11
    col: 1

