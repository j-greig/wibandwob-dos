<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Autoresearch wibwob-hosting-smoke</title><script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>body{font-family:Inter,system-ui,sans-serif;margin:20px} .card{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:12px} table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}</style></head><body>
<h2>Autoresearch: wibwob-hosting-smoke</h2><div id='status'></div>
<div class='card'><canvas id='c'></canvas></div><div class='card'><table><thead><tr><th>#</th><th>Score</th><th>Pass%</th><th>Status</th><th>Description</th></tr></thead><tbody id='rows'></tbody></table></div>
<script>let ch;async function r(){const d=await fetch('./results.json?'+Date.now()).then(r=>r.json());document.getElementById('status').textContent=`${d.status} · current #${d.current_experiment} · best ${d.best_score}%`;const labels=d.experiments.map(e=>'#'+e.id),vals=d.experiments.map(e=>e.pass_rate);if(!ch){ch=new Chart(document.getElementById('c'),{type:'line',data:{labels,datasets:[{label:'Pass rate %',data:vals,borderColor:'#7c3aed'}]},options:{scales:{y:{min:0,max:100}}}})}else{ch.data.labels=labels;ch.data.datasets[0].data=vals;ch.update()}document.getElementById('rows').innerHTML=d.experiments.map(e=>`<tr><td>${e.id}</td><td>${e.score}/${e.max_score}</td><td>${e.pass_rate}%</td><td>${e.status}</td><td>${e.description}</td></tr>`).join('')}r();setInterval(r,10000)</script></body></html>
