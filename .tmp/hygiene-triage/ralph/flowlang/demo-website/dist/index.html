<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowLang Output</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <script>
// FlowLang Runtime Initialization
const FlowLang = {
  elements: new Map(),
  flows: new Map(),
  timeline: [],
  particles: new Map(),
  easing: {
    linear: t => t,
    smooth: t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
    bounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    },
    elastic: (t, amplitude = 1, period = 0.3) => {
      if (t === 0 || t === 1) return t;
      const s = period / 4;
      return amplitude * Math.pow(2, -10 * t) * Math.sin((t - s) * (2 * Math.PI) / period) + 1;
    },
    spring: (t, stiffness = 100, damping = 10) => {
      const w = Math.sqrt(stiffness);
      const z = damping / (2 * Math.sqrt(stiffness));
      if (z < 1) {
        const wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
      }
      return 1 - Math.exp(-w * t) * (1 + w * t);
    }
  }
};

// Element: title
{
  const el = document.createElement('div');
  el.id = 'title';
  el.style.position = 'absolute';
  el.style.left = 400 + 'px';
  el.style.top = 100 + 'px';
  el.textContent = 'FlowLang';
  el.style.fontSize = 72 + 'px';
  el.style.backgroundColor = '#00ffff';
  el.style.opacity = 0;
  document.body.appendChild(el);
  FlowLang.elements.set('title', { el, props: {"x":"400","y":"100","shape":"text","content":"'FlowLang'","fontSize":"72","color":"'#00ffff'","opacity":"0"} });
}
// Element: subtitle
{
  const el = document.createElement('div');
  el.id = 'subtitle';
  el.style.position = 'absolute';
  el.style.left = 380 + 'px';
  el.style.top = 180 + 'px';
  el.textContent = 'Motion-Native Programming';
  el.style.fontSize = 24 + 'px';
  el.style.backgroundColor = '#ffffff';
  el.style.opacity = 0;
  document.body.appendChild(el);
  FlowLang.elements.set('subtitle', { el, props: {"x":"380","y":"180","shape":"text","content":"'Motion-Native Programming'","fontSize":"24","color":"'#ffffff'","opacity":"0"} });
}
// Element: morphShape
{
  const el = document.createElement('div');
  el.id = 'morphShape';
  el.style.position = 'absolute';
  el.style.left = 375 + 'px';
  el.style.top = 300 + 'px';
  el.style.width = 50 + 'px';
  el.style.height = 50 + 'px';
  el.style.backgroundColor = '#ff00ff';
  el.style.opacity = 0;
  document.body.appendChild(el);
  FlowLang.elements.set('morphShape', { el, props: {"x":"375","y":"300","width":"50","height":"50","shape":"circle","color":"'#ff00ff'","opacity":"0"} });
}
// Element: ball1
{
  const el = document.createElement('div');
  el.id = 'ball1';
  el.style.position = 'absolute';
  el.style.left = 200 + 'px';
  el.style.top = 50 + 'px';
  el.style.width = 30 + 'px';
  el.style.height = 30 + 'px';
  el.style.backgroundColor = '#ff0000';
  document.body.appendChild(el);
  FlowLang.elements.set('ball1', { el, props: {"x":"200","y":"50","width":"30","height":"30","shape":"circle","color":"'#ff0000'"} });
}
// Element: ball2
{
  const el = document.createElement('div');
  el.id = 'ball2';
  el.style.position = 'absolute';
  el.style.left = 600 + 'px';
  el.style.top = 50 + 'px';
  el.style.width = 30 + 'px';
  el.style.height = 30 + 'px';
  el.style.backgroundColor = '#00ff00';
  document.body.appendChild(el);
  FlowLang.elements.set('ball2', { el, props: {"x":"600","y":"50","width":"30","height":"30","shape":"circle","color":"'#00ff00'"} });
}
// Particles: stars
{
  const particles = [];
  const count = 50;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.style.position = 'absolute';
    p.style.left = (Math.random() * (800 - 0) + 0) + 'px';
    p.style.top = (Math.random() * (600 - 0) + 0) + 'px';
    p.style.width = 2 + 'px';
    p.style.height = 2 + 'px';
    p.style.backgroundColor = '#ffffff';
    p.style.opacity = (Math.random() * (1 - 0.3) + 0.3);
    p.dataset.initial = JSON.stringify({ x: p.style.left, y: p.style.top });
    document.body.appendChild(p);
    particles.push(p);
  }
  FlowLang.particles.set('stars', particles);
}
// Flow: titleFadeIn
FlowLang.flows.set('titleFadeIn', {
  target: 'title',
  keyframes: [
    { time: 0, properties: [
    { property: 'opacity', value: 0 }
    ] },
    { time: 1000, properties: [
    { property: 'opacity', value: 1 }
    ] },
  ],
  ease: 'smooth',
  repeat: 1,
  yoyo: false,
  delay: 0
});
// Flow: subtitleFadeIn
FlowLang.flows.set('subtitleFadeIn', {
  target: 'subtitle',
  keyframes: [
    { time: 0, properties: [
    { property: 'opacity', value: 0 }
    ] },
    { time: 1500, properties: [
    { property: 'opacity', value: 1 }
    ] },
  ],
  ease: 'smooth',
  repeat: 1,
  yoyo: false,
  delay: 0
});
// Flow: morphAppear
FlowLang.flows.set('morphAppear', {
  target: 'morphShape',
  keyframes: [
    { time: 0, properties: [
    { property: 'opacity', value: 0 },
    { property: 'width', value: 50 },
    { property: 'height', value: 50 }
    ] },
    { time: 1000, properties: [
    { property: 'opacity', value: 1 },
    { property: 'width', value: 50 },
    { property: 'height', value: 50 }
    ] },
  ],
  ease: 'smooth',
  repeat: 1,
  yoyo: false,
  delay: 0
});
// Flow: morphPulse
FlowLang.flows.set('morphPulse', {
  target: 'morphShape',
  keyframes: [
    { time: 0, properties: [
    { property: 'width', value: 50 },
    { property: 'height', value: 50 }
    ] },
    { time: 1000, properties: [
    { property: 'width', value: 80 },
    { property: 'height', value: 80 }
    ] },
    { time: 2000, properties: [
    { property: 'width', value: 50 },
    { property: 'height', value: 50 }
    ] },
  ],
  ease: 'smooth',
  repeat: -1,
  yoyo: false,
  delay: 0
});
// Flow: morphColorCycle
FlowLang.flows.set('morphColorCycle', {
  target: 'morphShape',
  keyframes: [
    { time: 0, properties: [
    { property: 'color', value: '#ff00ff' }
    ] },
    { time: 1000, properties: [
    { property: 'color', value: '#00ffff' }
    ] },
    { time: 2000, properties: [
    { property: 'color', value: '#ffff00' }
    ] },
    { time: 3000, properties: [
    { property: 'color', value: '#ff00ff' }
    ] },
  ],
  ease: 'smooth',
  repeat: -1,
  yoyo: false,
  delay: 0
});
// Flow: bounce1
FlowLang.flows.set('bounce1', {
  target: 'ball1',
  keyframes: [
    { time: 0, properties: [
    { property: 'y', value: 50 }
    ] },
    { time: 500, properties: [
    { property: 'y', value: 500 }
    ] },
    { time: 1000, properties: [
    { property: 'y', value: 50 }
    ] },
  ],
  ease: 'bounce',
  repeat: -1,
  yoyo: false,
  delay: 0
});
// Flow: bounce2
FlowLang.flows.set('bounce2', {
  target: 'ball2',
  keyframes: [
    { time: 0, properties: [
    { property: 'y', value: 50 }
    ] },
    { time: 600, properties: [
    { property: 'y', value: 500 }
    ] },
    { time: 1200, properties: [
    { property: 'y', value: 50 }
    ] },
  ],
  ease: 'bounce',
  repeat: -1,
  yoyo: false,
  delay: 0
});
window.addEventListener('DOMContentLoaded', () => {
  FlowLang.animate('titleFadeIn');
  FlowLang.animate('subtitleFadeIn');
  FlowLang.animate('morphAppear');
  FlowLang.animate('morphPulse');
  FlowLang.animate('morphColorCycle');
  FlowLang.animate('bounce1');
  FlowLang.animate('bounce2');
  // Spawn particles: stars
});

// FlowLang Animation Engine
FlowLang.animate = function(flowName) {
  const flow = FlowLang.flows.get(flowName);
  if (!flow) {
    console.error('Flow not found:', flowName);
    return;
  }

  const targetData = FlowLang.elements.get(flow.target);
  if (!targetData) {
    console.error('Element not found:', flow.target);
    return;
  }

  const el = targetData.el;
  const keyframes = flow.keyframes;
  const easeFn = FlowLang.easing[flow.ease] || FlowLang.easing.linear;

  // Simple animation using Web Animations API
  const cssKeyframes = [];

  for (const kf of keyframes) {
    const frame = {};
    const offset = kf.time / Math.max(...keyframes.map(k => k.time));

    for (const prop of kf.properties) {
      const cssProperty = {
        'opacity': 'opacity',
        'x': 'left',
        'y': 'top',
        'rotation': 'transform',
        'scale': 'transform'
      }[prop.property] || prop.property;

      if (cssProperty === 'left' || cssProperty === 'top') {
        frame[cssProperty] = prop.value + 'px';
      } else if (cssProperty === 'transform' && prop.property === 'rotation') {
        frame[cssProperty] = `rotate(${prop.value}deg)`;
      } else if (cssProperty === 'transform' && prop.property === 'scale') {
        frame[cssProperty] = `scale(${prop.value})`;
      } else {
        frame[cssProperty] = prop.value;
      }
    }

    frame.offset = offset;
    cssKeyframes.push(frame);
  }

  const duration = Math.max(...keyframes.map(k => k.time));
  const iterations = flow.repeat === -1 ? Infinity : flow.repeat;

  el.animate(cssKeyframes, {
    duration: duration,
    iterations: iterations,
    easing: flow.ease === 'smooth' ? 'ease-in-out' :
            flow.ease === 'bounce' ? 'cubic-bezier(0.68, -0.55, 0.265, 1.55)' :
            'linear',
    delay: flow.delay || 0,
    direction: flow.yoyo ? 'alternate' : 'normal',
    fill: 'forwards'
  });
};
  </script>
</body>
