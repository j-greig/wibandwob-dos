<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>∴ Cosmic Horror Generator ∴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00ff41;
            background: rgba(0, 255, 65, 0.05);
        }

        h1 {
            font-size: 2em;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ff41;
        }

        #controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background: rgba(0, 255, 65, 0.03);
        }

        input {
            background: #000;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            min-width: 300px;
        }

        input::placeholder {
            color: #006622;
        }

        button {
            background: #000;
            color: #00ff41;
            border: 2px solid #00ff41;
            padding: 10px 30px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            text-transform: uppercase;
        }

        button:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 20px #00ff41;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #output {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #00ff41;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.3);
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        #output.visible {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>∴ COSMIC HORROR GENERATOR ∴</h1>
        <p style="margin-top: 10px; font-size: 12px; opacity: 0.7;">Enter words to summon the Wib&Wob dual-voice</p>
    </div>

    <div id="controls">
        <input type="text" id="seedInput" placeholder="Enter cosmic seed words..." />
        <button id="generateBtn">GENERATE</button>
    </div>

    <div id="canvas-container">
        <canvas id="bgCanvas"></canvas>
        <div id="output"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
