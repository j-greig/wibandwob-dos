services:

  # Caddy reverse proxy — HTTPS termination + routing.
  # Human path: / -> basic_auth -> wibwob:7681 (ttyd)
  # Agent path: /api/* -> wibwob:8099 (control API, bearer-token auth inside app)
  #
  # NOTE: token-proxy (deploy/token-proxy.ts) is currently bypassed.
  # The browser goes direct to ttyd behind basic_auth.
  # Restore token-proxy if time-limited share links are needed.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Generate: caddy hash-password --plaintext 'yourpassword'
      # Set in /etc/wibwob.env on the VPS host, then pass here.
      - WIBWOB_BASIC_AUTH_HASH=${WIBWOB_BASIC_AUTH_HASH}
    depends_on:
      - wibwob

  # WibWob-DOS smoke image — runs ttyd (7681) + control API (8099) + sshd (22).
  # For the full multi-service compose (ttyd + token-proxy separate), see Dockerfile.
  wibwob:
    image: wibwob-vps-smoke:arm64
    restart: unless-stopped
    expose:
      - "7681"
      - "8099"
    ports:
      - "127.0.0.1:2222:22"   # SSH access for operators only — not public
    env_file:
      - /etc/wibwob.env        # ANTHROPIC_API_KEY, WIBWOB_DEPLOY_PROFILE, etc.

volumes:
  caddy_data:
  caddy_config:
